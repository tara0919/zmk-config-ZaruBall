CONFIG_SPI=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_PMW3610=y
# CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INVERT_Y=n
# CONFIG_PMW3610_ORIENTATION_90=y
CONFIG_INPUT=y
# CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=500
# CONFIG_PMW3610_SCROLL_TICK=16
# CONFIG_PMW3610_INVERT_SCROLL_X=y
# CONFIG_PMW3610_INVERT_SCROLL_Y=n
# CONFIG_PMW3610_SMART_ALGORITHM=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_SENSOR=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_INTERVAL_MS=500    

CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=60
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=3

# --- 入力レスポンス向上のための最適化設定 ---

# 押し込み時のデバウンス（チャタリング防止）時間を短縮し、反応を向上（デフォルト5ms → 1ms）
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# 離した時のデバウンス時間
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# メインスタックサイズを拡張し、動作の安定性を確保（1024 → 2048）
CONFIG_MAIN_STACK_SIZE=2048

# BLE通信のスループットを向上させる設定（高速通信モードを有効化）
CONFIG_BT_CTLR_PHY_2M=y

# NKRO（全キー同時押し）のレポート効率を改善
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
