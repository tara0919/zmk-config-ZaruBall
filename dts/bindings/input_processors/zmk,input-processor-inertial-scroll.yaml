description: Input processor for adding decaying inertial scroll after wheel input stops

compatible: "zmk,input-processor-inertial-scroll"

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 0
  track-remainders:
    type: boolean
  type:
    type: int
    required: true
  codes:
    type: array
    required: true
  interval-ms:
    type: int
    default: 16
  gain-percent:
    type: int
    default: 100
  start-threshold:
    type: int
    default: 1
  burst-threshold:
    type: int
    default: 1
  burst-timeout-ms:
    type: int
    default: 120
  burst-window-ms:
    type: int
    default: 80
  decay-percent:
    type: int
    default: 78
  stop-threshold:
    type: int
    default: 35
  max-step:
    type: int
    default: 4
