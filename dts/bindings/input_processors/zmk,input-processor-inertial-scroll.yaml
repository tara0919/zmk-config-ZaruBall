description: Input processor for adding decaying inertial scroll after wheel input stops

compatible: "zmk,input-processor-inertial-scroll"

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 0
  track-remainders:
    type: boolean
  type:
    type: int
    required: true
  codes:
    type: array
    required: true
  output-code:
    type: int
    default: 8
  axis-lock:
    type: boolean
    description: Lock XY input to the dominant axis and map X/Y to horizontal/vertical scroll
  axis-lock-threshold:
    type: int
    default: 4
    description: Minimum accumulated movement before choosing an axis
  axis-lock-ratio-percent:
    type: int
    default: 150
    description: Dominant-to-secondary axis ratio required for an immediate decision
  axis-lock-max-pending:
    type: int
    default: 12
    description: Total accumulated movement after which the larger axis is chosen
  axis-lock-release-ms:
    type: int
    default: 80
    description: Idle time across both axes before the selected axis is released
  interval-ms:
    type: int
    default: 16
  gain-percent:
    type: int
    default: 100
  velocity-percent:
    type: int
    default: 100
  min-velocity:
    type: int
    default: 0
  start-threshold:
    type: int
    default: 1
  burst-threshold:
    type: int
    default: 1
  burst-peak-threshold:
    type: int
    default: 1
  burst-peak-percent:
    type: int
    default: 0
  burst-timeout-ms:
    type: int
    default: 120
  burst-window-ms:
    type: int
    default: 80
  release-ms:
    type: int
    default: 40
  candidate-tail-base-ms:
    type: int
    default: 0
  candidate-tail-per-peak-ms:
    type: int
    default: 0
  candidate-tail-max-ms:
    type: int
    default: 0
  decay-percent:
    type: int
    default: 78
  tail-decay-percent:
    type: int
    default: 78
  tail-threshold:
    type: int
    default: 0
  stop-threshold:
    type: int
    default: 35
  max-step:
    type: int
    default: 4
  cancel-layer:
    type: int
    default: -1
